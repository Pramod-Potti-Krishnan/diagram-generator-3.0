[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && playwright install chromium --with-deps && curl -fsSL https://d2lang.com/install.sh | sh -s -- && export PATH=\"$HOME/.local/bin:$PATH\""

[deploy]
startCommand = "export PATH=\"$HOME/.local/bin:$PATH\" && python main.py"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[env]
# Railway will automatically inject PORT
# Add other environment variables in Railway Dashboard
