<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: {{BACKGROUND_COLOR}};
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        h1 {
            color: {{TEXT_COLOR}};
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .gantt-container {
            width: 100%;
            overflow-x: auto;
        }

        /* Frappe Gantt Theme Overrides */
        .gantt .grid-header {
            fill: #F9FAFB;
            stroke: #E5E7EB;
        }
        .gantt .grid-row {
            fill: {{BACKGROUND_COLOR}};
        }
        .gantt .grid-row:nth-child(even) {
            fill: #F9FAFB;
        }
        .gantt .row-line {
            stroke: #E5E7EB;
        }
        .gantt .tick {
            stroke: #E5E7EB;
        }
        .gantt .today-highlight {
            fill: rgba(139, 92, 246, 0.1);
        }

        /* Bar styles */
        .gantt .bar {
            fill: {{PRIMARY_COLOR}};
            stroke: {{SECONDARY_COLOR}};
            stroke-width: 0;
        }
        .gantt .bar-progress {
            fill: {{SECONDARY_COLOR}};
        }
        .gantt .bar-label {
            fill: {{TEXT_COLOR}};
            font-size: 12px;
            font-weight: 500;
        }

        /* Custom classes */
        .gantt .bar-wrapper.critical .bar {
            fill: #EF4444;
        }
        .gantt .bar-wrapper.critical .bar-progress {
            fill: #DC2626;
        }
        .gantt .bar-wrapper.completed .bar {
            fill: #9CA3AF;
        }
        .gantt .bar-wrapper.completed .bar-progress {
            fill: #6B7280;
        }
        .gantt .bar-wrapper.active .bar {
            fill: #3B82F6;
        }
        .gantt .bar-wrapper.active .bar-progress {
            fill: #2563EB;
        }

        /* Header text */
        .gantt .lower-text, .gantt .upper-text {
            fill: {{TEXT_COLOR}};
            font-size: 12px;
        }

        /* Arrow/dependency lines */
        .gantt .arrow {
            stroke: #9CA3AF;
            stroke-width: 1.5;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
</head>
<body>
    {{#if TITLE}}<h1>{{TITLE}}</h1>{{/if}}
    <div class="gantt-container">
        <svg id="gantt"></svg>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.umd.js"></script>
    <script>
        const tasks = {{TASKS_JSON}};
        const config = {{CONFIG_JSON}};

        const gantt = new Gantt('#gantt', tasks, {
            view_mode: config.view_mode || 'Month',
            readonly: true,
            bar_height: 30,
            padding: 18,
            date_format: 'YYYY-MM-DD',
            language: 'en',
            custom_popup_html: null
        });
    </script>
</body>
</html>
